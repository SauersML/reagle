name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'

permissions:
  contents: read
  actions: read

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR stability
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting 5 minutes..."
          sleep 300
          STATE=$(gh pr view ${{ github.event.pull_request.number }} -R ${{ github.repository }} --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR closed ($STATE). cancelling."
            exit 1
          fi
      - name: Skip check
        if: github.event_name != 'pull_request'
        run: echo "Not a PR, proceeding immediately."

  build-java:
    needs: check-status
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java
      run: |
        mkdir -p build/java
        git clone --depth 1 https://github.com/SauersML/Beagle beagle-java
        javac -d build/java $(find beagle-java -name "*.java")

    - name: Package Jar
      run: jar cfe beagle.jar main.Main -C build/java .

  build-rust:
    needs: check-status
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: rustfmt, clippy

    - name: Build Rust
      run: |
        cargo build --verbose

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bcftools tabix curl

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: nextest

    - name: Run Rust Tests (nextest)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cargo nextest run --release --verbose --failure-output=immediate

  reference-comparison:
    needs: check-status
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache reference test data
      uses: actions/cache@v4
      with:
        path: tests/data/cache
        key: ${{ runner.os }}-reference-test-cache-v1-${{ hashFiles('tests/common/mod.rs', 'tests/reference_comparison.rs', 'tests/reference_comparison_chr21.rs') }}
        restore-keys: |
          ${{ runner.os }}-reference-test-cache-v1-

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: rustfmt, clippy

    - name: Build Rust
      run: |
        cargo build --verbose

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bcftools tabix curl

    - name: Run reference comparison tests
      run: |
        cargo test --release --test reference_comparison

  reference-comparison-chr21:
    needs: check-status
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Cache reference test data
      uses: actions/cache@v4
      with:
        path: tests/data/cache
        key: ${{ runner.os }}-reference-test-cache-v1-${{ hashFiles('tests/common/mod.rs', 'tests/reference_comparison.rs', 'tests/reference_comparison_chr21.rs') }}
        restore-keys: |
          ${{ runner.os }}-reference-test-cache-v1-

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: rustfmt, clippy

    - name: Build Rust
      run: |
        cargo build --verbose

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bcftools tabix curl

    - name: Run chr21 reference comparison tests
      run: |
        cargo test --release --test reference_comparison_chr21 -- --nocapture
