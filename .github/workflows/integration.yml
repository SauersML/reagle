name: Integration Test

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:
    inputs:
      keep_phased:
        description: 'Keep input phased (skip de-phasing)'
        required: false
        default: false
        type: boolean
      phasing_only:
        description: 'Run phasing comparison jobs only'
        required: false
        default: false
        type: boolean

jobs:

  # ============================================================================
  # INTEGRATION TEST DATA PREPARATION
  #
  # Uses FULL chr22 dataset (~830K markers), NOT the 5% profiling subset.
  # This is different from bench.yml which uses prepare-profile (5% subset).
  #
  # WARNING: The full dataset may cause state allocation to stall (6+ hours).
  # See bench.yml for the faster 5% profiling subset (~4 hours).
  # ============================================================================

  # Job 2: Prepare test data (runs in parallel with build)
  prepare-data:
    runs-on: ubuntu-latest
    env:
      KEEP_PHASED: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_phased == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix curl


      - name: Cache test data
        id: cache-data
        uses: actions/cache@v4
        with:
          path: tests/data/
          key: test-data-hgdp1kg-chr22-v2${{ env.KEEP_PHASED == 'true' && '-phased' || '' }}

      # Creates FULL chr22 dataset (~830K markers)
      # For 5% profiling subset, see bench.yml which uses prepare-profile
      - name: Prepare test data (FULL chr22, not 5% subset)
        if: steps.cache-data.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          args=""
          if [[ "${KEEP_PHASED}" == "true" ]]; then
            args="--keep-phased"
          fi
          python3 tests/integration_test.py prepare ${args}

      # Upload FULL dataset (100% of chr22 markers)
      - name: Upload prepared data (FULL chr22)
        uses: actions/upload-artifact@v4
        with:
          name: test-data
          path: |
            tests/data/ref.vcf.gz
            tests/data/ref.vcf.gz.csi
            tests/data/truth.vcf.gz
            tests/data/truth.vcf.gz.csi
            tests/data/input.vcf.gz
            tests/data/input.vcf.gz.csi
            tests/data/beagle.jar
            tests/data/train_samples.txt
            tests/data/test_samples.txt
          retention-days: 1

  # Job 2b: Prepare 5% chr22 data
  prepare-profile-data:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.phasing_only == true) }}
    runs-on: ubuntu-latest
    env:
      KEEP_PHASED: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_phased == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix curl


      - name: Cache 5% chr22 data
        id: cache-profile-data
        uses: actions/cache@v4
        with:
          path: tests/data/
          key: test-data-hgdp1kg-chr22-profile5-v2${{ env.KEEP_PHASED == 'true' && '-phased' || '' }}

      - name: Prepare 5% chr22 data
        if: steps.cache-profile-data.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          args=""
          if [[ "${KEEP_PHASED}" == "true" ]]; then
            args="--keep-phased"
          fi
          python3 tests/integration_test.py prepare-profile ${args}

      - name: Upload prepared 5% chr22 data
        uses: actions/upload-artifact@v4
        with:
          name: test-data-chr22-5pct
          path: |
            tests/data/ref.vcf.gz
            tests/data/ref.vcf.gz.csi
            tests/data/truth.vcf.gz
            tests/data/truth.vcf.gz.csi
            tests/data/input.vcf.gz
            tests/data/input.vcf.gz.csi
            tests/data/beagle.jar
            tests/data/train_samples.txt
            tests/data/test_samples.txt
          retention-days: 1

  # Job 3: Run Beagle imputation (depends on prepare-data)
  impute-beagle:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.phasing_only == true) }}
    runs-on: ubuntu-latest
    needs: prepare-data
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix openjdk-17-jre

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: tests/data/

      - name: Run Beagle imputation
        working-directory: .
        run: python3 tests/integration_test.py beagle

      - name: Upload Beagle results
        uses: actions/upload-artifact@v4
        with:
          name: beagle-results
          path: |
            tests/data/beagle_imputed.vcf.gz
            tests/data/beagle_imputed.vcf.gz.csi
          retention-days: 1

  # Job 3b: Run Beagle imputation (5% of chr22)
  impute-beagle-profile:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.phasing_only == true) }}
    runs-on: ubuntu-latest
    needs: prepare-profile-data
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix openjdk-17-jre

      - name: Download prepared 5% chr22 data
        uses: actions/download-artifact@v4
        with:
          name: test-data-chr22-5pct
          path: tests/data/

      - name: Run Beagle imputation (5% chr22)
        working-directory: .
        run: python3 tests/integration_test.py beagle

      - name: Upload Beagle results (5% chr22)
        uses: actions/upload-artifact@v4
        with:
          name: beagle-results-chr22-5pct
          path: |
            tests/data/beagle_imputed.vcf.gz
            tests/data/beagle_imputed.vcf.gz.csi
          retention-days: 1

  # ============================================================================
  # REAGLE INTEGRATION TEST
  #
  # Runs on FULL chr22 dataset (~830K markers), NOT the 5% profiling subset.
  #
  # WARNING: Known to stall in state allocation phase (0/818 samples for 6+ hours).
  # The single-threaded allocator cannot handle the full dataset complexity.
  # See bench.yml pprof_flamegraph job for successful runs on 5% subset.
  # ============================================================================

  # Job 4: Run Reagle imputation (builds and runs on same runner)
  impute-reagle:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.phasing_only == true) }}
    runs-on: ubuntu-latest
    needs: [prepare-data]
    env:
      RUSTFLAGS: "-C target-cpu=native"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Reagle
        working-directory: .
        run: cargo build --release

      # Downloads FULL chr22 dataset (100% of markers, ~830K)
      - name: Download prepared data (FULL chr22)
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: tests/data/

      # Runs on FULL dataset - may stall in state allocation
      - name: Run Reagle imputation (FULL chr22 - may stall)
        id: reagle-run
        working-directory: .
        run: |
          set -o pipefail
          python3 tests/integration_test.py reagle

      - name: Upload Reagle results
        uses: actions/upload-artifact@v4
        with:
          name: reagle-results
          path: |
            tests/data/reagle_imputed.vcf.gz
            tests/data/reagle_imputed.vcf.gz.csi
          retention-days: 1

  # Job 4b: Run Reagle imputation (5% of chr22)
  impute-reagle-profile:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.phasing_only == true) }}
    runs-on: ubuntu-latest
    needs: [prepare-profile-data]
    env:
      RUSTFLAGS: "-C target-cpu=native"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Reagle
        working-directory: .
        run: cargo build --release

      - name: Download prepared 5% chr22 data
        uses: actions/download-artifact@v4
        with:
          name: test-data-chr22-5pct
          path: tests/data/

      - name: Run Reagle imputation (5% chr22)
        id: reagle-run
        working-directory: .
        run: |
          set -o pipefail
          python3 tests/integration_test.py reagle

      - name: Upload Reagle results (5% chr22)
        uses: actions/upload-artifact@v4
        with:
          name: reagle-results-chr22-5pct
          path: |
            tests/data/reagle_imputed.vcf.gz
            tests/data/reagle_imputed.vcf.gz.csi
          retention-days: 1

  # Job 4c: Reagle phasing-only (FULL chr22)
  phasing-reagle:
    runs-on: ubuntu-latest
    needs: [prepare-data]
    env:
      RUSTFLAGS: "-C target-cpu=native"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Reagle
        working-directory: .
        run: cargo build --release

      - name: Download prepared data (FULL chr22)
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: tests/data/

      - name: Run Reagle phasing-only
        working-directory: .
        run: python3 tests/integration_test.py phasing-reagle

      - name: Upload Reagle phasing outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reagle-phasing-results
          path: |
            tests/data/reagle_phased.vcf.gz
            tests/data/reagle_phased.vcf.gz.csi
          retention-days: 1

  # Job 4d: EagleImp phasing-only (FULL chr22)
  phasing-eagleimp:
    runs-on: ubuntu-latest
    needs: [prepare-data]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bcftools tabix curl build-essential cmake \
            zlib1g-dev libboost-dev libboost-filesystem-dev libboost-program-options-dev \
            libtbb-dev libhts-dev

      - name: Build EagleImp
        run: |
          git clone --depth 1 https://github.com/ikmb/eagleimp.git "$RUNNER_TEMP/eagleimp"
          cmake -DCMAKE_BUILD_TYPE=Release -S "$RUNNER_TEMP/eagleimp/src" -B "$RUNNER_TEMP/eagleimp/build"
          cmake --build "$RUNNER_TEMP/eagleimp/build" -j
          echo "EAGLEIMP_BIN=$RUNNER_TEMP/eagleimp/build/eagleimp" >> "$GITHUB_ENV"

      - name: Download prepared data (FULL chr22)
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: tests/data/

      - name: Run EagleImp phasing-only
        working-directory: .
        run: python3 tests/integration_test.py phasing-eagleimp

      - name: Upload EagleImp phasing outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eagleimp-phasing-results
          path: |
            tests/data/eagleimp_phased*.vcf.gz.csi
          retention-days: 1

  # Job 4f: Beagle phasing-only (FULL chr22)
  phasing-beagle:
    runs-on: ubuntu-latest
    needs: [prepare-data]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix openjdk-17-jre

      - name: Download prepared data (FULL chr22)
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: tests/data/

      - name: Run Beagle phasing-only
        working-directory: .
        run: python3 tests/integration_test.py phasing-beagle

      - name: Upload Beagle phasing outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beagle-phasing-results
          path: |
            tests/data/beagle_phased.vcf.gz
            tests/data/beagle_phased.vcf.gz.csi
          retention-days: 1

  # Job 4e: Phasing metrics (depends on both phasing jobs)
  phasing-compare:
    runs-on: ubuntu-latest
    needs: [phasing-reagle, phasing-eagleimp, phasing-beagle]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools tabix

      - name: Download prepared data (FULL chr22)
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: tests/data/

      - name: Download Reagle phasing outputs
        uses: actions/download-artifact@v4
        with:
          name: reagle-phasing-results
          path: tests/data/

      - name: Download EagleImp phasing outputs
        uses: actions/download-artifact@v4
        with:
          name: eagleimp-phasing-results
          path: tests/data/

      - name: Download Beagle phasing outputs
        uses: actions/download-artifact@v4
        with:
          name: beagle-phasing-results
          path: tests/data/

      - name: Calculate phasing metrics
        working-directory: .
        run: python3 tests/integration_test.py phasing-metrics

      - name: Summarize phasing comparison (full chr22)
        working-directory: .
        run: |
          if [[ -f tests/data/phasing_compare_summary.md ]]; then
            cat tests/data/phasing_compare_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload phasing metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phasing-compare-results
          path: |
            tests/data/*_phasing_metrics.json
            tests/data/*_phasing_metrics.txt
            tests/data/phasing_compare_summary.md
          retention-days: 1



  # Job 5: Calculate metrics (depends on both imputation jobs)
  analyze:
    if: >-
      ${{
        !(github.event_name == 'workflow_dispatch' && inputs.phasing_only == true) &&
        always() &&
        needs.impute-beagle.result == 'success' &&
        needs.impute-reagle.result == 'success'
      }}
    runs-on: ubuntu-latest
    needs: [impute-beagle, impute-reagle]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: test-data
          path: tests/data/

      - name: Download Beagle results
        uses: actions/download-artifact@v4
        with:
          name: beagle-results
          path: tests/data/

      - name: Download Reagle results
        uses: actions/download-artifact@v4
        with:
          name: reagle-results
          path: tests/data/

      - name: Calculate metrics
        working-directory: .
        run: python3 tests/integration_test.py metrics

      - name: Summarize all shared metrics (full chr22)
        working-directory: .
        run: |
          python3 scripts/compare_metrics.py \
            --reagle tests/data/reagle_metrics.json \
            --beagle tests/data/beagle_metrics.json \
            --label "integration-full-chr22" \
            --output tests/data/all_metrics_comparison.md
          cat tests/data/all_metrics_comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Install plotting dependencies
        run: python3 -m pip install --quiet matplotlib

      - name: Generate plots
        working-directory: .
        run: python3 tests/plot_metrics.py

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imputation-metrics
          path: |
            tests/data/*_metrics.txt
            tests/data/*_metrics.json
            tests/data/all_metrics_comparison.md

      - name: Upload plots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imputation-plots
          path: tests/data/plots/*.png
          retention-days: 30

  # Job 5b: Calculate metrics (5% of chr22)
  analyze-chr22-5pct:
    if: >-
      ${{
        !(github.event_name == 'workflow_dispatch' && inputs.phasing_only == true) &&
        always() &&
        needs.impute-beagle-profile.result == 'success' &&
        needs.impute-reagle-profile.result == 'success'
      }}
    runs-on: ubuntu-latest
    needs: [impute-beagle-profile, impute-reagle-profile]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bcftools

      - name: Download prepared 5% chr22 data
        uses: actions/download-artifact@v4
        with:
          name: test-data-chr22-5pct
          path: tests/data/

      - name: Download Beagle results (5% chr22)
        uses: actions/download-artifact@v4
        with:
          name: beagle-results-chr22-5pct
          path: tests/data/

      - name: Download Reagle results (5% chr22)
        uses: actions/download-artifact@v4
        with:
          name: reagle-results-chr22-5pct
          path: tests/data/

      - name: Calculate metrics (5% chr22)
        working-directory: .
        run: python3 tests/integration_test.py metrics

      - name: Summarize all shared metrics (5% chr22)
        working-directory: .
        run: |
          python3 scripts/compare_metrics.py \
            --reagle tests/data/reagle_metrics.json \
            --beagle tests/data/beagle_metrics.json \
            --label "integration-chr22-5pct" \
            --output tests/data/all_metrics_comparison.md
          cat tests/data/all_metrics_comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics (5% chr22)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imputation-metrics-chr22-5pct
          path: |
            tests/data/*_metrics.txt
            tests/data/*_metrics.json
            tests/data/all_metrics_comparison.md
          retention-days: 30
