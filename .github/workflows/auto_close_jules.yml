name: Auto-Close Jules PRs

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  check-and-close:
    runs-on: ubuntu-latest
    steps:
      - name: Check and close PR if criteria met
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login.toLowerCase();
            const title = context.payload.pull_request.title.toLowerCase();
            const body = (context.payload.pull_request.body || '').toLowerCase();
            
            // Check username contains 'jules' but is not exactly 'jules'
            if (!author.includes('jules') || author === 'jules') {
              console.log(`Author "${author}" does not match criteria. Skipping.`);
              return;
            }
            
            console.log(`Author "${author}" matches jules criteria.`);
            
            // Check mentions of compilation/build.rs in title or body
            const mentionsKeyword = 
              title.includes('compilation') || 
              title.includes('build.rs') ||
              body.includes('compilation') || 
              body.includes('build.rs');
            
            if (mentionsKeyword) {
              console.log('PR mentions "compilation" or "build.rs" in title/body.');
            }
            
            // Check if build.rs is modified
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const touchesBuildRs = files.data.some(f => f.filename.endsWith('build.rs'));
            
            if (touchesBuildRs) {
              console.log('PR modifies a build.rs file.');
            }
            
            if (mentionsKeyword || touchesBuildRs) {
              // Add comment explaining closure
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: 'This PR was automatically closed because it appears to be from an automated system and touches build configuration.'
              });
              
              // Close the PR
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                state: 'closed'
              });
              
              console.log('PR closed successfully.');
            } else {
              console.log('PR does not meet closure criteria (no build.rs mention or edit).');
            }
