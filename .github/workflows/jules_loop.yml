name: Jules Optimizer Loop

on:
  schedule:
    - cron: '0 */3 * * *'

  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  gate:
    name: Gate scheduled runs on recent changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event ${{ github.event_name }} is not a schedule; running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_min=$(( (now - latest) / 60 ))
          window=300
          if [ "$age_min" -lt "$window" ]; then
            echo "Last commit ${age_min}m ago (< ${window}m); running scheduled job."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last commit ${age_min}m ago (>= ${window}m); nothing changed, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  optimize:
    needs: gate
    if: ${{ github.event_name != 'schedule' || needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run Jules Loop Script
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/jules_loop.py
