name: Imputation Quality Benchmark

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/imputation_quality.rs'
      - 'scripts/plot_quality.py'
      - '.github/workflows/imputation_quality_report.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/imputation_quality.rs'
      - 'scripts/plot_quality.py'
      - '.github/workflows/imputation_quality_report.yml'

jobs:
  impute-and-measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - person: "Kat"
            file_path: "data/kat_suricata/23andme_genome_kat_suricata_v5_full_20171221130201.txt"
            format: "23andme"
          - person: "Kat"
            file_path: "data/kat_suricata/ancestrydna.txt"
            format: "ancestry"
          - person: "Christopher"
            file_path: "data/christopher_smith/dna-data-2023-09-26.zip"
            format: "23andme"
          - person: "Christopher"
            file_path: "data/christopher_smith/genome_Christopher_Smith_v5_Full_20230926164611.zip"
            format: "23andme"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Tools
        run: sudo apt-get update && sudo apt-get install -y bcftools tabix

      - name: Build Reagle
        run: cargo build --release

      - name: Run Benchmark
        run: python3 scripts/benchmark.py --person "${{ matrix.person }}" --file "${{ matrix.file_path }}" --format "${{ matrix.format }}"

      - name: Upload Metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.person }}-${{ matrix.format }}
          path: |
            reagle_metrics.json
            beagle_metrics.json

  generate-report:
    needs: impute-and-measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Metrics
        uses: actions/download-artifact@v4
        with:
          path: metrics
          
      - name: Install Python Deps
        run: pip install matplotlib
        
      - name: Generate Report
        run: |
          find metrics -name "reagle_metrics.json" | while read fname; do
             DIR=$(dirname "$fname")
             python3 scripts/plot_quality.py "$DIR"
             echo "" >> $GITHUB_STEP_SUMMARY
             cat "$DIR/summary.md" >> $GITHUB_STEP_SUMMARY
          done
          
      - name: Upload HTML Reports
        uses: actions/upload-artifact@v4
        with:
          name: imputation-reports
          path: "metrics/**/*.html"
