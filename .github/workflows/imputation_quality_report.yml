name: Imputation Quality Assessment

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'

jobs:
  check-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR stability
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting 5 minutes..."
          sleep 300
          STATE=$(gh pr view ${{ github.event.pull_request.number }} -R ${{ github.repository }} --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR closed ($STATE). cancelling."
            exit 1
          fi
      - name: Skip check
        if: github.event_name != 'pull_request'
        run: echo "Not a PR, proceeding immediately."

  prepare-shared:
    needs: check-status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache reference panel
        id: cache-reference
        uses: actions/cache@v4
        with:
          path: |
            ref.vcf.gz
            ref.vcf.gz.csi
          key: reference-panel-${{ runner.os }}-${{ hashFiles('scripts/prepare_data.py') }}

      - name: Install Python
        if: steps.cache-reference.outputs.cache-hit != 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Tools
        if: steps.cache-reference.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y bcftools tabix wget curl git

      - name: Prepare reference panel
        if: steps.cache-reference.outputs.cache-hit != 'true'
        run: python3 scripts/prepare_data.py reference ref.vcf.gz

      - name: Upload reference panel
        uses: actions/upload-artifact@v4
        with:
          name: reference-panel
          path: |
            ref.vcf.gz
            ref.vcf.gz.csi

  impute-and-measure:
    needs: prepare-shared
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - person: "Kat"
            file_path: "data/kat_suricata/23andme_genome_kat_suricata_v5_full_20171221130201.txt"
            truth_glob: "data/kat_suricata/**"
          - person: "Kat"
            file_path: "data/kat_suricata/ancestrydna.txt"
            truth_glob: "data/kat_suricata/**"
          - person: "Christopher"
            file_path: "data/christopher_smith/dna-data-2023-09-26.zip"
            truth_glob: "data/christopher_smith/**"
          - person: "Christopher"
            file_path: "data/christopher_smith/genome_Christopher_Smith_v5_Full_20230926164611.zip"
            truth_glob: "data/christopher_smith/**"

    steps:
      - uses: actions/checkout@v4

      - name: Cache chr22 FASTA
        uses: actions/cache@v4
        with:
          path: .cache/reference/chr22.fa.gz
          key: chr22-fasta-${{ runner.os }}-v1

      - name: Cache prep artifacts
        id: cache-prep
        uses: actions/cache@v4
        with:
          path: |
            ref.vcf.gz
            ref.vcf.gz.csi
            convert_genome_array_out/panel.vcf
            convert_genome_array_out/panel.vcf.gz
            convert_genome_array_out/genotypes.vcf
            convert_genome_array_out/genotypes.vcf.gz
            convert_genome_truth_out/panel.vcf
            convert_genome_truth_out/panel.vcf.gz
            convert_genome_truth_out/genotypes.vcf
            convert_genome_truth_out/genotypes.vcf.gz
            reagle_ref.vcf.gz
            reagle_ref.vcf.gz.csi
            reagle_ref.vcf.gz.tbi
            ref_beagle.vcf.gz
            ref_beagle.vcf.gz.csi
            ref_beagle.vcf.gz.tbi
            beagle.jar
            target.vcf.gz
            target.vcf.gz.csi
            target.vcf.gz.tbi
            truth.vcf.gz
            truth.vcf.gz.csi
            truth.vcf.gz.tbi
          key: prep-${{ runner.os }}-${{ matrix.person }}-${{ hashFiles(matrix.file_path, matrix.truth_glob, 'scripts/prepare_data.py', 'scripts/quality_assessment.py') }}

      - name: Cache imputation results
        id: cache-results
        uses: actions/cache@v4
        with:
          path: |
            tests/data/reagle_metrics.json
            tests/data/beagle_metrics.json
            tests/data/reagle_metrics.txt
            tests/data/reagle_imputed.vcf.gz
            tests/data/reagle_imputed.vcf.gz.csi
            tests/data/reagle_imputed.vcf.gz.tbi
            tests/data/beagle_imputed.vcf.gz
            tests/data/beagle_imputed.vcf.gz.csi
            tests/data/beagle_imputed.vcf.gz.tbi
            tests/data/truth.vcf.gz
            tests/data/truth.vcf.gz.csi
            tests/data/truth.vcf.gz.tbi
            reagle_out.vcf.gz
            reagle_out.vcf.gz.csi
            reagle_out.vcf.gz.tbi
            beagle_out.vcf.gz
            beagle_out.vcf.gz.csi
            beagle_out.vcf.gz.tbi
          key: results-${{ runner.os }}-${{ matrix.person }}-${{ hashFiles(matrix.file_path, matrix.truth_glob, 'scripts/quality_assessment.py', 'scripts/prepare_data.py', 'tests/integration_test.py', 'Cargo.lock', 'Cargo.toml', 'build.rs', 'src/**') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        if: steps.cache-results.outputs.cache-hit != 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Java
        if: steps.cache-results.outputs.cache-hit != 'true'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Tools
        if: steps.cache-results.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y bcftools tabix wget curl git

      - name: Download reference panel
        if: steps.cache-results.outputs.cache-hit != 'true' && steps.cache-prep.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: reference-panel
          path: .
          merge-multiple: true

      - name: Build Reagle
        run: cargo build --release

      - name: Run Quality Assessment
        if: steps.cache-results.outputs.cache-hit != 'true'
        run: python3 scripts/quality_assessment.py --person "${{ matrix.person }}" --file "${{ matrix.file_path }}"

      - name: Diagnostics (post-run)
        if: always()
        run: |
          set +e
          echo "=== Workspace Files ==="
          ls -lh
          echo "=== Data Files ==="
          ls -lh tests/data || true
          echo "=== Tool Versions ==="
          bcftools --version | head -1 || true
          tabix --version | head -1 || true
          java -version 2>&1 | head -1 || true
          echo "=== VCF Record Counts ==="
          for f in ref.vcf.gz target.vcf.gz truth.vcf.gz tests/data/reagle_imputed.vcf.gz tests/data/beagle_imputed.vcf.gz; do
            if [ -f "$f" ]; then
              echo "$f"
              bcftools index -n "$f" || true
            fi
          done
          echo "=== VCF Headers (first 5 lines) ==="
          for f in tests/data/reagle_imputed.vcf.gz tests/data/beagle_imputed.vcf.gz tests/data/truth.vcf.gz; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              bcftools view -h "$f" | head -5 || true
            fi
          done
          set -e

      - name: Upload Metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.person }}-${{ hashFiles(matrix.file_path) }}
          path: |
            tests/data/reagle_metrics.json
            tests/data/beagle_metrics.json
            tests/data/reagle_metrics.txt

      - name: Upload Run Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.person }}-${{ hashFiles(matrix.file_path) }}
          if-no-files-found: warn
          path: |
            tests/data/reagle_imputed.vcf.gz
            tests/data/reagle_imputed.vcf.gz.csi
            tests/data/reagle_imputed.vcf.gz.tbi
            tests/data/beagle_imputed.vcf.gz
            tests/data/beagle_imputed.vcf.gz.csi
            tests/data/beagle_imputed.vcf.gz.tbi
            tests/data/truth.vcf.gz
            tests/data/truth.vcf.gz.csi
            tests/data/truth.vcf.gz.tbi
            target.vcf.gz
            target.vcf.gz.csi
            target.vcf.gz.tbi
            reagle_out.vcf.gz
            reagle_out.vcf.gz.csi
            reagle_out.vcf.gz.tbi
            beagle_out.vcf.gz
            beagle_out.vcf.gz.csi
            beagle_out.vcf.gz.tbi

  generate-report:
    needs: impute-and-measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Metrics
        uses: actions/download-artifact@v4
        with:
          path: metrics
          
      - name: Install Python Deps
        run: pip install matplotlib
        
      - name: Generate Report
        run: |
          find metrics -name "reagle_metrics.json" | while read fname; do
             DIR=$(dirname "$fname")
             python3 scripts/plot_quality.py "$DIR"
             echo "" >> $GITHUB_STEP_SUMMARY
             cat "$DIR/summary.md" >> $GITHUB_STEP_SUMMARY
          done
          
      - name: Upload HTML Reports
        uses: actions/upload-artifact@v4
        with:
          name: imputation-reports
          path: "metrics/**/*.html"
