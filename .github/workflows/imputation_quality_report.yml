name: Imputation Quality Benchmark

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/imputation_quality.rs'
      - 'scripts/plot_quality.py'
      - '.github/workflows/imputation_quality_report.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/imputation_quality.rs'
      - 'scripts/plot_quality.py'
      - '.github/workflows/imputation_quality_report.yml'

jobs:
  impute-and-measure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - person: "Kat"
            file_path: "data/kat_suricata/23andme_genome_kat_suricata_v5_full_20171221130201.txt"
            format: "23andme"
          - person: "Kat"
            file_path: "data/kat_suricata/ancestrydna.txt"
            format: "ancestry"
          - person: "Christopher"
            file_path: "data/christopher_smith/dna-data-2023-09-26.zip"
            format: "23andme"
          - person: "Christopher"
            file_path: "data/christopher_smith/genome_Christopher_Smith_v5_Full_20230926164611.zip"
            format: "23andme"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Java (for Beagle)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          # Install bcftools/tabix
          sudo apt-get update && sudo apt-get install -y bcftools tabix

      - name: Build Reagle
        run: cargo build --release

      - name: Prepare Input Data
        run: |
          # Use Python script to prep everything
          # 1. Target (Array)
          python3 scripts/prepare_data.py array "${{ matrix.file_path }}" target.vcf.gz
          
      - name: Prepare Reference Panel
        run: |
          # 2. Reference (Chr22)
          python3 scripts/prepare_data.py reference ref.vcf.gz

      - name: Run Reagle Imputation
        run: |
          ./target/release/reagle \
            --ref ref.vcf.gz \
            --target target.vcf.gz \
            --out reagle_out \
            --chromosome 22

      - name: Run Beagle Imputation
        run: |
          BEAGLE_JAR="tests/fixtures/beagle_reference/beagle.27Feb25.75f.jar"
          java -Xmx6g -jar $BEAGLE_JAR \
            ref=ref.vcf.gz \
            gt=target.vcf.gz \
            out=beagle_out \
            chrom=22 \
            nthreads=2

      - name: Run Quality Metrics (Rust Test)
        run: |
          # 3. Truth (WGS)
          # Map person to data dir
          PERSON="${{ matrix.person }}"
          if [[ "$PERSON" == "Kat" ]]; then
             TRUTH_DIR="data/kat_suricata"
          else
             TRUTH_DIR="data/christopher_smith"
          fi
          
          python3 scripts/prepare_data.py truth "$TRUTH_DIR" truth.vcf.gz
          
          # Run Rust Metrics
          export TEST_TRUTH_VCF="truth.vcf.gz"
          
          # Reagle Metrics
          export TEST_IMP_VCF="reagle_out.vcf.gz"
          export TEST_OUTPUT_JSON="reagle_metrics.json"
          cargo test --test imputation_quality test_metrics_calculation_dummy -- --nocapture
          
          # Beagle Metrics
          export TEST_IMP_VCF="beagle_out.vcf.gz"
          export TEST_OUTPUT_JSON="beagle_metrics.json"
          cargo test --test imputation_quality test_metrics_calculation_dummy -- --nocapture

      - name: Upload Metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.person }}-${{ matrix.format }}
          path: |
            reagle_metrics.json
            beagle_metrics.json

  generate-report:
    needs: impute-and-measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Metrics
        uses: actions/download-artifact@v4
        with:
          path: metrics
          
      - name: Install Python Deps
        run: pip install matplotlib
        
      - name: Generate Report
        run: |
          find metrics -name "reagle_metrics.json" | while read fname; do
             DIR=$(dirname "$fname")
             # Generate report (HTML with images, MD text-only summary)
             python3 scripts/plot_quality.py "$DIR"
             
             echo "" >> $GITHUB_STEP_SUMMARY
             cat "$DIR/summary.md" >> $GITHUB_STEP_SUMMARY
          done
          
      - name: Upload HTML Reports
        uses: actions/upload-artifact@v4
        with:
          name: imputation-reports
          path: "metrics/**/*.html"
